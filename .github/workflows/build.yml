name: Build APK

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置 JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 设置 Gradle 缓存
      uses: gradle/actions/setup-gradle@v4

    - name: 赋予 gradlew 执行权限
      run: chmod +x gradlew

    - name: 编译 Debug APK
      run: ./gradlew assembleDebug

- name: 上传 APK 产物
  uses: actions/upload-artifact@v4
  with:
    name: KigHelper-debug
    path: app/build/outputs/apk/*/debug/*.apk   # 👈 把 debug 改成 */debug
